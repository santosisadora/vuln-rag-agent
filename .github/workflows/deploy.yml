name: Deploy Vulnerability Agent

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # <--- This adds a manual trigger button in the UI

jobs:
  evaluate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LangSmith Regression Evals
        env:
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LANGCHAIN_TRACING_V2: "true"
          PYTHONPATH: "."
        run: python -m src.evaluate

      # --- NEW AWS ECR DEPLOYMENT STEPS ---

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # <--- FORCED TO N. VIRGINIA

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: secops-vuln-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. Build the Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # 2. Push the unique commit hash tag
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # 3. Tag and push as 'latest' for easy pulling
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Download current ECS task definition
        # Dynamically grabs your active task config so you don't have to manage a JSON file locally!
        run: |
          aws ecs describe-task-definition --task-definition secops-triage-task --query taskDefinition > task-definition.json

      - name: Update task definition with the new Docker image ID and DB Secret
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: secops-triage-container
          image: ${{ steps.login-ecr.outputs.registry }}/secops-vuln-agent:${{ github.sha }}
          environment-variables: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: secops-triage-task-service-4mjftlhp
          cluster: security-cluster
          wait-for-service-stability: true